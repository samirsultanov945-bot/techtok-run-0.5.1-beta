name: Build TechTok Run APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Project directory:"
          pwd
          echo "Files:"
          ls -la
          echo "Checking buildozer.spec:"
          test -f "$GITHUB_WORKSPACE/buildozer.spec"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python3 -m pip install --user --break-system-packages buildozer cython==0.29.36

      - name: Build APK
        working-directory: ${{ github.workspace }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pwd
          ls -la
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TechTok-Run-APK
          path: bin/*.apk
